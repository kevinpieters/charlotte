<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Date with Kevin</title>
<style>
:root {
  --bg: #fff8e1;
  --text: #2b2b2b;
  --road: #555;
  --accent: #f9b800;
  --accent-text: #2b2b2b;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1b16; --text: #f3efe2; --road: #3a3a3a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1b16; --text: #f3efe2; --road: #3a3a3a; color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}
.screen {
  min-height: 100%; box-sizing: border-box; padding: 1.5rem;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 1.25rem; text-align: center;
}
.screen.active { display: flex; }
h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.4rem); }
p { margin: 0; font-size: 1.15rem; }
button {
  background: var(--accent); color: var(--accent-text);
  border: 0; border-radius: 999px; padding: 0.9rem 1.8rem; max-width: 100%;
  font-size: 1.05rem; font-weight: 700; cursor: pointer; font-family: inherit;
  box-shadow: 0 4px 0 rgba(0,0,0,0.25);
}
button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
.choices { display: flex; flex-direction: column; gap: 0.9rem; width: 100%; max-width: 360px; }
.choices button { width: 100%; }
.scene { width: 100%; max-width: 480px; height: 150px; position: relative; overflow: hidden; }
.road { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: var(--road); }
#taxi { position: absolute; bottom: 14px; left: 50%; width: 220px; margin-left: -110px; animation: drive 1.2s ease-out; }
@keyframes drive { from { transform: translateX(-120%); } to { transform: translateX(0); } }
#msg, #cont { display: none; }
#msg.show, #cont.show { display: block; animation: fade 0.5s ease-out; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
#party { background: linear-gradient(135deg, #ff6b9d, #ffb347, #ffe66d, #6bd6ff, #b18cff); color: #2b2b2b; position: relative; overflow: hidden; }
#party h1 { font-size: clamp(1.8rem, 6vw, 3rem); animation: pop 0.8s ease-out; }
@keyframes pop { 0% { transform: scale(0.3); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
.big { font-size: 4rem; animation: bounce 1s infinite alternate; }
@keyframes bounce { to { transform: translateY(-14px) rotate(8deg); } }
.confetti { position: absolute; top: -20px; width: 10px; height: 16px; opacity: 0.9; animation: fall linear forwards; pointer-events: none; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
  <section class="screen active" id="s1">
    <h1>A special invitation 💌</h1>
    <button id="btn" type="button">Click here if you would like to go on a date with Kevin</button>
    <div class="scene" id="scene" style="visibility:hidden" aria-live="polite">
      <svg id="taxi" viewBox="0 0 220 100" role="img" aria-label="Yellow taxi" style="display:none">
        <rect x="8" y="46" width="204" height="36" rx="10" fill="#f9b800" stroke="#222" stroke-width="3"/>
        <path d="M52 46 L68 20 H148 L168 46 Z" fill="#f9b800" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
        <path d="M62 44 L74 25 H106 V44 Z" fill="#cfe9f7" stroke="#222" stroke-width="2"/>
        <path d="M112 44 V25 H144 L158 44 Z" fill="#cfe9f7" stroke="#222" stroke-width="2"/>
        <rect x="92" y="8" width="36" height="12" rx="3" fill="#fff" stroke="#222" stroke-width="2"/>
        <text x="110" y="18" font-size="9" font-weight="700" text-anchor="middle" fill="#222" font-family="sans-serif">TAXI</text>
        <rect x="14" y="52" width="12" height="8" rx="2" fill="#fff6b0"/>
        <rect x="194" y="52" width="12" height="8" rx="2" fill="#e53935"/>
        <circle cx="56" cy="82" r="14" fill="#222"/><circle cx="56" cy="82" r="6" fill="#aaa"/>
        <circle cx="164" cy="82" r="14" fill="#222"/><circle cx="164" cy="82" r="6" fill="#aaa"/>
      </svg>
      <div class="road"></div>
    </div>
    <p id="msg">Taxi is here for your date with Kevin!</p>
    <button id="cont" type="button">Continue</button>
  </section>

  <section class="screen" id="s2">
    <h1>Pick a game for your date 🎮</h1>
    <div class="choices">
      <button type="button" data-game="Slay The Spire 2">Slay The Spire 2</button>
      <button type="button" data-game="Disney Dreamlight Valley">Disney Dreamlight Valley</button>
      <button type="button" data-game="Lorcana">Lorcana</button>
    </div>
  </section>

  <section class="screen" id="s3">
    <div class="big">🎉</div>
    <h1>Kevin is very excited you chose this option</h1>
    <p id="chosen"></p>
    <div class="big">🥳</div>
  </section>

<script>
  function show(id) {
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
  }
  var btn = document.getElementById("btn");
  btn.addEventListener("click", function () {
    btn.style.display = "none";
    document.getElementById("scene").style.visibility = "visible";
    document.getElementById("taxi").style.display = "block";
    setTimeout(function () {
      document.getElementById("msg").classList.add("show");
      document.getElementById("cont").classList.add("show");
    }, 1200);
  });
  document.getElementById("cont").addEventListener("click", function () { show("s2"); });
  document.querySelectorAll("[data-game]").forEach(function (b) {
    b.addEventListener("click", function () {
      document.getElementById("chosen").textContent = "Your pick: " + b.getAttribute("data-game");
      show("s3");
      var colors = ["#ff3d71", "#ffd23f", "#3ddc97", "#3d9bff", "#b18cff", "#ffffff"];
      var party = document.getElementById("s3");
      party.id = "party";
      for (var i = 0; i < 80; i++) {
        var c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "%";
        c.style.background = colors[i % colors.length];
        c.style.animationDuration = (2 + Math.random() * 3) + "s";
        c.style.animationDelay = (Math.random() * 1.5) + "s";
        party.appendChild(c);
      }
    });
  });
</script>
</body>
</html>
